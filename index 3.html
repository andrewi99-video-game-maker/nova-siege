<title>Upgrade Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: a full-bleed 3D stage with sticker-style HUD cards pinned to the corners.
   One look on purpose: a sunlit toy world. Dark mode would only fight the sky, so the page keeps a single set of tokens. */
:root {
  --ink: #1b2740;
  --paper: #fffaf0;
  --paper2: #fff0d6;
  --sky: #ffe6c8;
  --speed: #ffc933;
  --jump: #3aa0ff;
  --dbl: #1fd1a5;
  --str: #ff5a3c;
  --gun: #b18cff; --sprint: #ff8fc7; --armor: #7fe3ff; --rifle: #ffd23f; --sword: #e7eef9;
  --coin: #ffd23f;
  --good: #c6f2d9;
  --bad: #ffd3c9;
  --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 600 14px/1.35 var(--font-body); overflow: hidden; }
button { font-family: inherit; }
[hidden] { display: none !important; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
#gl { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
#hud {
  z-index: 0;
  position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 8px 12px; }
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; }
.col.right { align-items: flex-end; }
.lvl { min-width: 0; max-width: 100%; }
.kicker { margin: 0 0 4px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.lvl h2 { margin: 0 0 6px; font: 400 26px/1 var(--font-display); text-wrap: balance; }
.needs { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; }
.lab { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.need { padding: 1px 8px; border: 2px solid var(--ink); border-radius: 99px; font-weight: 800; }
.need.ok { background: var(--good); }
.need.no { background: var(--bad); }
.race { min-width: min(300px, 100%); }
.racebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.place { font: 400 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.place small { font: 800 12px/1 var(--font-body); opacity: .65; margin-left: 4px; }
.coins { display: inline-flex; align-items: center; gap: 6px; font: 400 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.clock { font: 800 13px/1 var(--font-body); opacity: .7; font-variant-numeric: tabular-nums; }
.coins small { font: 800 12px/1 var(--font-body); color: #1c7a45; }
.coin-ico { width: 20px; height: 20px; border: 3px solid var(--ink); border-radius: 50%; background: var(--coin); box-sizing: border-box; display: inline-block; }
.track { position: relative; height: 14px; margin-top: 8px; border: 3px solid var(--ink); border-radius: 99px; background: var(--paper2); }
.track::after { content: ''; position: absolute; right: 4px; top: 1px; bottom: 1px; width: 6px; background: repeating-linear-gradient(0deg, var(--ink) 0 3px, #fff 3px 6px); border-radius: 2px; }
.dot { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 3px solid var(--ink); border-radius: 50%; background: var(--c, #fff); box-sizing: border-box; transition: left .12s linear; }
.dot.me { width: 22px; height: 22px; margin: -11px 0 0 -11px; z-index: 2; }
.missions { max-width: 270px; padding: 8px 10px; }
.missions h3 { margin: 0 0 4px; font: 400 15px/1 var(--font-display); letter-spacing: .04em; }
.missions ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.missions li { display: flex; gap: 6px; align-items: baseline; font-size: 12px; font-weight: 800; line-height: 1.25; }
.missions li i { flex: none; width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; box-sizing: border-box; align-self: center; }
.missions li.done i { background: var(--good); }
.missions li.done span { text-decoration: line-through; opacity: .6; }
.missions li.lock { opacity: .55; }
.missions b { margin-left: auto; padding-left: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; max-width: 300px; justify-content: flex-end; }
.slot { display: flex; flex-direction: column; gap: 5px; padding: 5px 9px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper2); opacity: .55; }
.slot.on { opacity: 1; background: var(--c); }
.sn { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
.pips { display: flex; gap: 3px; }
.pips i { width: 12px; height: 6px; border: 2px solid var(--ink); border-radius: 3px; box-sizing: content-box; }
.pips i.on { background: var(--ink); }
.dot.ghost { opacity: .55; transform: scale(.8); } #runN { font-weight: 800; margin-left: 6px; }
.pips b { font-size: 11px; margin-left: 3px; } .lvl { font-size: 12px; opacity: .7; font-weight: 700; margin-left: 4px; }
.bottom { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; justify-content: space-between; }
.acts { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; }
.act {
  padding: 8px 14px; border: 3px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); cursor: pointer;
  font: 400 17px/1 var(--font-display); box-shadow: 3px 3px 0 var(--ink); display: inline-flex; gap: 8px; align-items: center;
}
.act kbd { font-size: 11px; padding: 3px 6px; }
.act.hot { background: var(--str); }
.act.gun { background: var(--gun); }
.act:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.act:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.act.cool { opacity: .6; }
.act:focus-visible, .go:focus-visible, .alt:focus-visible, .buy:focus-visible, .race-btn:focus-visible { outline: 3px solid var(--jump); outline-offset: 3px; }
.keys { margin: 0; padding: 6px 10px; font-size: 12px; font-weight: 800; }
kbd { display: inline-block; min-width: 12px; padding: 4px 7px; border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 7px; background: #fff; font: 800 12px/1 var(--font-body); text-align: center; }
#count {
  position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(1); font: 400 clamp(90px, 22vw, 190px)/1 var(--font-display);
  color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--ink); pointer-events: none; opacity: 0; letter-spacing: .02em;
}
#count.show { opacity: 1; animation: pop .55s ease-out both; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); } }
#pops { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.pop { padding: 6px 14px; border: 3px solid var(--ink); border-radius: 99px; background: var(--coin); box-shadow: 3px 3px 0 var(--ink); font: 400 20px/1 var(--font-display); animation: rise 1.7s ease-out both; }
.pop.mission { background: var(--dbl); }
.pop.ko { background: var(--str); color: #fff; text-shadow: 2px 2px 0 var(--ink); }
@keyframes rise { 0% { opacity: 0; transform: translateY(14px) scale(.8); } 12% { opacity: 1; transform: translateY(0) scale(1.06); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }
#toast {
  position: absolute; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); width: max-content; max-width: calc(100% - 32px);
  padding: 10px 18px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); box-shadow: 4px 4px 0 var(--ink);
  text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast b { display: block; font: 400 24px/1.1 var(--font-display); }
#toast span { display: block; font-size: 13px; font-weight: 800; }
#toast span:empty { display: none; }
#toast.speed { background: var(--speed); } #toast.jump { background: var(--jump); } #toast.dbl { background: var(--dbl); }
#toast.str { background: var(--str); } #toast.bad { background: var(--bad); } #toast.gun { background: var(--gun); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
#flash.on { opacity: .5; }
#overlay {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 236, 208, .6); backdrop-filter: blur(3px);
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.panel { width: 100%; max-width: 540px; max-height: 100%; overflow-y: auto; padding: 24px 26px; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 8px 8px 0 var(--ink); }
.panel.small { max-width: 460px; }
.panel.wide { max-width: 860px; }
.eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.panel h1 { margin: 0 0 10px; font: 400 clamp(38px, 9vw, 58px)/1 var(--font-display); text-wrap: balance; }
.panel h2 { margin: 18px 0 8px; font: 400 22px/1 var(--font-display); }
.lead { margin: 0 0 14px; font-size: 16px; line-height: 1.45; max-width: 62ch; }
.keys-list { margin: 0 0 18px; padding: 0; list-style: none; display: grid; gap: 8px; }
.keys-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.keys-list span { margin-left: 4px; font-size: 14px; }
.note { margin: 0 0 14px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--bad); font-weight: 800; }
.note.good { background: var(--good); }
.stats { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 0 0 12px; }
.stats span:first-child { font: 400 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stats span:last-child { font-size: 13px; font-weight: 800; opacity: .75; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.go, .alt {
  padding: 10px 22px; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); color: var(--ink);
  font: 400 22px/1.1 var(--font-display); cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.go { background: var(--speed); }
.alt { background: var(--paper); }
.go:hover, .alt:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.go:active, .alt:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.rlist { margin: 0 0 10px; padding: 0; list-style: none; display: grid; gap: 6px; }
.rlist li { display: flex; align-items: baseline; gap: 8px; font-weight: 800; }
.rlist li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.rlist li.done { opacity: .8; }
.rlist li .tick { width: 16px; height: 16px; border: 2px solid var(--ink); border-radius: 5px; background: #fff; align-self: center; flex: none; box-sizing: border-box; }
.rlist li.done .tick { background: var(--good); }
.hubtop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.item { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper2); }
.item h3 { margin: 0; font: 400 20px/1 var(--font-display); display: flex; gap: 8px; align-items: center; }
.item h3 i { width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 4px; background: var(--c); flex: none; box-sizing: border-box; }
.item p { margin: 0; font-size: 12.5px; line-height: 1.3; flex: 1; }
.item.owned { background: var(--good); }
.item.locked { opacity: .6; }
.buy {
  padding: 7px 10px; border: 3px solid var(--ink); border-radius: 10px; background: var(--coin); color: var(--ink); cursor: pointer;
  font: 400 17px/1 var(--font-display); box-shadow: 3px 3px 0 var(--ink); display: flex; justify-content: center; gap: 6px; align-items: center;
}
.buy:disabled { background: var(--paper); opacity: .6; cursor: not-allowed; box-shadow: none; }
.buy:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.races { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.race-btn {
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 8px 12px; text-align: left; border: 3px solid var(--ink); border-radius: 14px;
  background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
}
.race-btn b { font: 400 18px/1 var(--font-display); }
.race-btn span { font-size: 12px; font-weight: 800; }
.race-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.race-btn.cur { background: var(--speed); }
.race-btn .miss { color: #b3261e; }
@media (max-width: 520px) {
  .lvl h2 { font-size: 22px; }
  .keys { display: none; }
  .panel { padding: 18px; }
  .missions { max-width: 100%; }
  .place { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  #toast, #flash, .go, .alt, .dot { transition: none; }
  #count.show, .pop { animation: none; opacity: 1; }
}

#cross { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; pointer-events: none; z-index: 1; opacity: .85; border: 3px solid #fff; border-radius: 50%; box-sizing: border-box; box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 2px var(--ink); }
#cross i { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--ink); }
#cross.armed { opacity: 1; } #cross.armed i { background: var(--rifle); }
#lockHint { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); margin: 0; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 99px; background: var(--paper); font-weight: 800; font-size: 13px; pointer-events: none; z-index: 2; }
.weapons { display: flex; gap: 6px; pointer-events: auto; } .weapons.cool .wbtn.on { opacity: .55; }
.wbtn { font: inherit; font-weight: 800; font-size: 13px; padding: 7px 10px; border: 3px solid var(--ink); border-radius: 12px; background: var(--paper2); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
.wbtn.on { background: var(--gun); } .wbtn kbd { font-size: 11px; padding: 2px 5px; }
.armorbar { position: relative; padding: 6px 10px; min-width: 150px; overflow: hidden; font-weight: 800; font-size: 12px; }
.armorbar span { position: relative; z-index: 1; } .armorbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--armor); opacity: .7; }
.lobbydots { font: 400 26px/1 var(--font-display); margin: 4px 0 12px; }
.alt.online { background: var(--dbl); }
</style>
<div id="stage">
  <canvas id="gl" aria-label="Upgrade Run game view"></canvas>
  <div id="hud">
    <div class="top">
      <div class="col">
        <section class="card missions" aria-label="Missions">
          <h3>Missions</h3>
          <ul id="missions"></ul>
        </section>
      </div>
      <section class="card race" aria-label="Race standing">
        <div class="racebar"><span class="place" id="place">1st<small>of 4</small></span><span class="clock" id="time">0:00.0</span><span class="coins"><i class="coin-ico"></i><b id="coinN">0</b><small id="runN"></small></span></div>
        <div class="track" id="track" aria-hidden="true"></div>
      </section>
      <div class="col right">
        <section class="card slots" id="slots" aria-label="Upgrades"></section>
        <section class="card armorbar" id="armorBar" aria-label="Armor" hidden></section>
      </div>
    </div>
    <div id="count" aria-live="assertive"></div>
    <div id="pops" aria-live="polite"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div class="bottom">
      <div class="acts" id="acts">
        <div id="weapons" class="weapons" hidden></div>
        <button class="act hot" type="button" data-act="shove"><kbd>F</kbd> Shove</button>
        <button class="act" type="button" data-act="shop"><kbd>B</kbd> Shop</button>
        <button class="act" type="button" data-act="restart"><kbd>R</kbd> Restart</button>
      </div>
      <p class="card keys"><kbd>WASD</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Mouse</kbd> aim &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>F</kbd> shove &nbsp; <kbd>Click</kbd> fire &nbsp; <kbd>M</kbd> sound</p>
    </div>
  </div>
  <div id="cross" aria-hidden="true"><i></i></div>
  <p id="lockHint" hidden>Click the game to look and aim with the mouse</p>
  <div id="flash"></div>
  <div id="overlay" role="dialog" aria-modal="true" aria-label="Game menu"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== CORE: physics + level builder (no DOM, shared with tests) ===== */
const PHYS = {
  G: 32, STEP: 1 / 120, PW: 0.4, PH: 1.8, STEPUP: 0.3, COYOTE: 0.1, BUFFER: 0.12, KILLY: -8.4,
  DJ: 0.92, EPS: 1e-4, BOUNCE: 22
};
/* upgrade levels are unlimited: the first few steps are big, later ones smaller */
function speedAt(l) { return l < 3 ? [7, 10, 13][l] : 13 + 1.5 * (l - 2); }
function jumpAt(l) { return l < 3 ? [11, 13.5, 16][l] : 16 + 1.2 * (l - 2); }
function sprintMul(l) { return 1.25 + 0.08 * l; }
const ROMAN = ['', 'I', 'II', 'III'];

function newUp() { return { speed: 0, jump: 0, dbl: false, str: 0, sprint: 0 }; }
function cloneUp(u) { return { speed: u.speed, jump: u.jump, dbl: u.dbl, str: u.str, sprint: u.sprint || 0 }; }

/* ---------- builder: levels walk along -Z ---------- */
class Builder {
  constructor() {
    this.boxes = []; this.movers = []; this.crumbles = []; this.blinks = []; this.spinners = [];
    this.pendulums = []; this.bars = []; this.jets = []; this.orbs = []; this.stars = []; this.signs = [];
    this.rubbles = []; this.segs = []; this.props = [];
    this.zc = 0; this.top = 0; this.x = 0; this.prev = null; this.prevOpt = {}; this.goal = null; this.spawn = null;
    this.t = 0; this.nid = 0; this.pendingMover = null; this.startBox = null;
    this.sec = 0; this.turns = [];
  }
  _add(o) { o.id = this.nid++; o.on = true; o.sec = this.sec; this.boxes.push(o); return o; }
  /* turn the course by k quarter turns (1 = right, -1 = left) at the current, square platform: everything built afterwards is placed in a rotated frame */
  turn(k) {
    const b = this.prev;
    this.turns.push({ k, sec: this.sec + 1, a: { x: (b.x0 + b.x1) / 2, z: (b.z0 + b.z1) / 2 } });
    this.sec++;
  }
  _plat(x, top, zmax, w, d, kind) {
    return this._add({
      kind: kind || 'solid', x0: x - w / 2, x1: x + w / 2, y0: top - 1.2, y1: top,
      z0: zmax - d, z1: zmax, w, d, top
    });
  }
  start(w, d) {
    const b = this._plat(0, 0, 0, w, d);
    this.zc = -d; this.top = 0; this.x = 0; this.prev = b; this.prevOpt = {}; this.startBox = b;
    this.spawn = { x: 0, y: 0, z: -d + 1.8 };
    // starting grid: four lanes side by side near the back of the start pad
    const gz = -Math.min(d - 2.5, 4.5), sp = Math.min(2.4, (w - 2) / 3);
    this.grid = [-1.5, -0.5, 0.5, 1.5].map((k) => ({ x: k * sp, y: 0, z: gz }));
    return this;
  }
  /* gap = edge-to-edge distance along z, dy = height change, x = lateral centre */
  p(gap, w, d, dy, x, opt) {
    dy = dy || 0; opt = opt || {};
    if (x === undefined) x = this.x;
    const top = this.top + dy, kind = opt.kind || 'solid';
    const b = this._plat(x, top, this.zc - gap, w, d, kind);
    if (kind === 'crumble') { const c = { box: b, state: 0, timer: 0 }; b.crumble = c; this.crumbles.push(c); }
    if (kind === 'ice') b.slip = true;
    if (kind === 'belt') b.belt = { vx: opt.vx || 0, vz: opt.vz || 0 };
    if (kind === 'bounce') b.bounce = opt.vy || PHYS.BOUNCE;
    if (kind === 'blink') { b.blink = { period: opt.period || 3.4, on: opt.on || 2.2, phase: opt.phase || 0 }; this.blinks.push(b); }
    this.segs.push({
      gap, dy, w, d, prevD: this.prev.d, prevW: this.prev.w, prevKind: this.prev.kind, prevOpt: this.prevOpt,
      from: this.prev.id, to: b.id, kind, opt, shuttle: !!opt.shuttle, label: opt.label || '', mover: this.pendingMover, sec: this.sec, req: reqOf(opt, gap, dy)

      let g = Net.ghosts.get(pe.peer);
      if (!g) {
        const col = Math.max(0, Math.min(0xffffff, fin(d.c, 0x1000000) | 0)) || 0x59b7ff;
        const nm = String(d.n || 'Runner').replace(/[^A-Za-z0-9 _-]/g, '').slice(0, 14) || 'Runner';
        const rn = Art.makeRunner({ color: col, name: nm, isPlayer: false }); rn.g.position.set(fin(d.x, 1e5), fin(d.y, 1e4), fin(d.z, 1e5));
        levelGroup.add(rn.g);
        const dot = document.createElement('i'); dot.className = 'dot ghost'; dot.style.setProperty('--c', '#' + ('000000' + col.toString(16)).slice(-6)); const tr = $('track'); if (tr) tr.appendChild(dot);
        g = { rn, dot, x: rn.g.position.x, y: rn.g.position.y, z: rn.g.position.z }; Net.ghosts.set(pe.peer, g);
      }
      const tx = fin(d.x, 1e5), ty = fin(d.y, 1e4), tz = fin(d.z, 1e5), vx = fin(d.vx, 60), vz = fin(d.vz, 60);
      const k = Math.min(1, dt * 12); g.x += (tx + vx * 0.05 - g.x) * k; g.y += (ty - g.y) * k; g.z += (tz + vz * 0.05 - g.z) * k;
      const rn = g.rn, sp = Math.hypot(vx, vz);
      rn.g.visible = !d.d; rn.g.position.set(g.x, g.y, g.z);
      if (sp > 0.4) { const f = Math.atan2(-vx, -vz); let da = f - rn.g.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da)); rn.g.rotation.y += da * Math.min(1, dt * 14); }
      rn.phase += sp * dt * 1.15; const sw = Math.sin(rn.phase) * 0.95 * Math.min(1, sp / 5);
      if (d.g) { rn.legL.rotation.x = sw; rn.legR.rotation.x = -sw; rn.armL.rotation.x = -sw * 0.9; rn.armR.rotation.x = sw * 0.9; }
      else { rn.legL.rotation.x = -0.7; rn.legR.rotation.x = 0.45; rn.armL.rotation.x = -2.5; rn.armR.rotation.x = -2.5; }
      if (g.dot) g.dot.style.left = (3 + Math.max(0, Math.min(1, fin(d.pr, 2))) * 94) + '%';
    }
    for (const [id, g] of Net.ghosts) if (!seen.has(id)) { if (g.rn.g.parent) g.rn.g.parent.remove(g.rn.g); if (g.dot && g.dot.parentNode) g.dot.parentNode.removeChild(g.dot); Net.ghosts.delete(id); }
    if (Net.lobby) Net.others = lobbyCount;
    if (shown !== Net.n) { Net.n = shown; netStatus(); }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').className = ''; }
    if (!overlayOpen && race) {
      if (mode === 'race') {
        if (keys.has('KeyQ')) yaw += dt * 1.9; if (keys.has('KeyE')) yaw -= dt * 1.9;
        const iv = inputVec(), P = race.player.p, still = Math.hypot(P.vx, P.vz) < 0.6;
        if (fireHeld && weapon === 'rifle') shootQ = true;
        const inp = { dx: iv.dx, dz: iv.dz, jump: jumpQ, shove: shoveQ, shoot: shootQ, weapon, sprint: keys.has('ShiftLeft') || keys.has('ShiftRight') || sprintBtn };
        if (shootQ || (shoveQ && still)) {
          // the shot goes where the crosshair points: from the player's chest to a spot far along the camera's line of sight
          const cp0 = Math.cos(pitch), fwx = -Math.sin(yaw) * cp0, fwy = -Math.sin(pitch), fwz = -Math.cos(yaw) * cp0;
          const cx = camera.position.x + fwx * 60, cy = camera.position.y + fwy * 60, cz = camera.position.z + fwz * 60;
          inp.ax = cx - P.x; inp.ay = cy - (P.y + 1.1); inp.az = cz - P.z;
          inp.fx = -Math.sin(yaw); inp.fz = -Math.cos(yaw);
        }
        const ticks = race.acc + dt >= PHYS.STEP;
        race.update(dt, inp);
        if (ticks || race.phase !== 'run') jumpQ = shoveQ = shootQ = false;
        handle(race.drain());
      } else if (mode === 'dead') { modeTimer -= dt; if (modeTimer <= 0) startRace(li); }
      hudClock += dt; slowClock += dt; if (hudClock > 0.12) { hudClock = 0; hudFast(); } if (slowClock > 0.5) { slowClock = 0; hudSlow(); }
    }
    if (Net.online) { netFrame(dt); if (Net.lobby) lobbyTick(dt); }
    const attract = overlayOpen && ov.dataset.kind === 'start';
    if (attract) yaw += dt * 0.14;
    if (W && race) updateVisuals(overlayOpen && !attract ? 0 : dt);
    renderer.render(scene, camera);
  }

  
  /* ---------- boot ---------- */
  function boot(d) {
    d = d || {};
    if (d.unlocked !== undefined) apply(d); else load();
    li = G.li; L = LEVELS[li];
    race = new Race(li, [], { countdown: 1.8, seed: 1 }); W = race.W;
    buildScene(); buildTrack(); hudStatic(); hudSlow(); hudFast();
    $('toast').className = ''; showOverlay('start');
    last = performance.now(); requestAnimationFrame(frame);
  }
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (G.started ? { unlocked: G.unlocked, best: G.best, li: G.li } : {})); } catch (e) { /* hot reload is optional */ }
  const go = () => { try { (window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(boot) : boot((window.claude && window.claude.hot && window.claude.hot.data) || {}); } catch (e) { boot({}); } };
  let fontsReady = null;
  try { fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('70px "Lilita One"'), new Promise((r) => setTimeout(r, 1500))]) : null; } catch (e) { /* ignore */ }
  if (fontsReady) fontsReady.then(go, go); else go();
})();
